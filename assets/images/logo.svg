<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Logo La 120 - Pastas y Carnes (Italian food)</title>
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="#fff"/>
  <!-- Italian stripe at top -->
  <rect x="0" y="0" width="256" height="36" fill="url(#grad)"/>
  <!-- Plate circle -->
  <circle cx="128" cy="140" r="70" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="4"/>
  <!-- Pasta swirl (simple) -->
  <path d="M128 110 C140 110 150 120 150 132 C150 144 140 154 128 154 C116 154 106 144 106 132" fill="none" stroke="#E39B2A" stroke-width="6" stroke-linecap="round"/>
  <path d="M128 122 C134 122 140 126 140 132 C140 138 134 142 128 142 C122 142 116 138 116 132" fill="none" stroke="#C57A18" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork -->
  <g transform="translate(90,82)">
    <rect x="28" y="0" width="8" height="52" rx="3" fill="#6B6B6B"/>
    <rect x="24" y="0" width="16" height="6" rx="2" fill="#6B6B6B"/>
    <rect x="24" y="8" width="4" height="18" fill="#fff"/>
    <rect x="32" y="8" width="4" height="18" fill="#fff"/>
    <rect x="40" y="8" width="4" height="18" fill="#fff"/>
  </g>
  <!-- Small text fallback (hidden visually, for accessibility) -->
  <text x="128" y="230" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">La 120</text>
</svg>
